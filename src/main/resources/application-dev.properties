# Configuracoes para PostgreSQL gerenciado na Render.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agrix}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:agrix}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:suasenha}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Em producao, defina JWT_SECRET como uma chave longa e aleatoria na Render.
api.security.token.secret=${JWT_SECRET:minhasenha}

# Origens permitidas separadas por virgula.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.swagger-ui.path=/swagger-ui/index.html
server.port=${PORT:10000}